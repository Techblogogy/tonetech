[project]
name = "tonetech"
version = "0.1.0"
description = "An agent-driven terminal pedalboard: real-time guitar effects with a Claude tone tech in the side pane."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Fedor Bobylev", email = "fedorbobylev@gmail.com" }]
keywords = ["guitar", "audio", "tui", "textual", "pedalboard", "claude", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "textual>=0.80",
  "pedalboard>=0.9.14",
  "numpy>=1.26",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tonetech = "tonetech.__main__:main"

[project.urls]
Homepage = "https://github.com/Techblogogy/tonetech"
Issues = "https://github.com/Techblogogy/tonetech/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonetech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
